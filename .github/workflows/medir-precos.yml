# Mede se dá para reler o preço dos produtos salvos. NÃO escreve nada.
#
# É o passo anterior ao cron de rechecagem diária: antes de construir o pipeline
# inteiro, descobrir se ele acertaria 90% ou 20% das lojas que de fato são usadas.
# A resposta muda o desenho — uma loja que bloqueia sempre pede adaptador ou
# desistência, e isso não se sabe sem medir.
#
# Só `workflow_dispatch`: rodar sozinho não faria sentido, e bater em loja de graça
# todo dia sem necessidade é pedir para tomar bloqueio.
#
# ## Secrets
#
# Além de SUPABASE_URL e SUPABASE_KEY (que a extensão já usa), precisa de
# APPINGOS_EMAIL e APPINGOS_SENHA — os produtos estão atrás da RLS, e lê-los exige
# um JWT de usuário. **Vale criar uma conta só para isto** e convidá-la aos espaços,
# em vez de usar a senha pessoal: o repositório é público, e uma credencial de robô
# se revoga sem afetar mais nada.
#
# ## Privacidade
#
# O log de Actions em repositório público é legível por qualquer um, então o
# relatório não imprime URL nem nome de produto — só hostname e contagens.

name: Medir rechecagem de preço

on:
  workflow_dispatch:

# Explícito e mínimo: este workflow só lê.
permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # O Playwright fica fora do package.json de propósito: ele só serve a este
      # workflow, e entraria no `npm ci` de todo mundo (inclusive do workflow que
      # publica a extensão) sem servir a nada lá. A versão está fixada aqui.
      - name: Instalar Playwright e o Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Medir
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          APPINGOS_EMAIL: ${{ secrets.APPINGOS_EMAIL }}
          APPINGOS_SENHA: ${{ secrets.APPINGOS_SENHA }}
        run: node scripts/medir-precos.mjs
